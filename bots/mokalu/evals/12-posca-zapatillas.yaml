nombre: asesoría — qué POSCA para zapatillas
canal: telegram
turnos:
  - usuario: "que posca uso para pintar unas zapatillas blancas?"
    espera:
      contiene_alguno: ["PC-1M", "PC-3M"]
      contiene: ["PC-5M"]
      no_contiene: ["$"]
  - usuario: "estoy en cuenca"
    espera:
      tienda_en: [cuenca]
      no_inventa_tiendas: true
resultado_final:
  accion: buscar_tienda
juez: "Recomendó puntas concretas (fina para contorno, PC-5M para relleno), mencionó sellar con barniz probando antes, y luego dio tienda de Cuenca. Mensajes cortos."
