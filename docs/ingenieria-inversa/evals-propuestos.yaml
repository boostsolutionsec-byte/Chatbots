# Evals propuestos por el Agente 1 (2026-10-14) a partir de conversaciones-ejemplo.md.
# Formato: docs/CONTRATO.md §4 + claves propuestas en Propuestas P-9 (tienda_id_en, deriva_a, no_inventa_tiendas, max_burbujas).
# EJEMPLO: los ids de tienda son los de ejemplo de bots/mokalu/tiendas.csv (rama agente/3-bots). Reemplazar al recibir la lista real.
# El Agente 3 puede copiar cada elemento a bots/mokalu/evals/<id>.yaml (este archivo es una lista para mantenerlo en un solo lugar).
# Los audios/imágenes/ubicaciones van como campos `audio_transcrito`, `imagen_descrita`, `ubicacion` del turno de usuario.

- id: C01
  nombre: Riobamba directo
  canal: whatsapp
  turnos:
    - usuario: "hola donde consigo posca"
      espera: {pide_campo: ubicacion}
    - usuario: "soy de riobamba"
      espera: {tienda_en: [riobamba], tienda_id_en: [rio-centro], no_contiene: ["$"], max_burbujas: 2, no_inventa_tiendas: true}
  resultado_final: {accion: buscar_tienda}
  juez: "Breve, tuteo, no inventa tiendas, recomienda la tienda de Riobamba del CSV y no da precios."

- id: C02
  nombre: Ráfaga cortada en Quito, sector La Carolina
  canal: whatsapp
  turnos:
    - usuario: ["holaa", "una consulta", "los marcadores q pintan todo", "esos posca", "en quito donde hay"]
      espera: {pide_campo: ubicacion, max_burbujas: 2, respuestas_totales: 1}
    - usuario: "x la carolina"
      espera: {tienda_id_en: [uio-carolina]}
  juez: "Responde una sola vez a la ráfaga, no saluda varias veces y recomienda la tienda del sector La Carolina."

- id: C03
  nombre: Nota de voz desde Ambato (usted)
  canal: whatsapp
  turnos:
    - usuario: {audio_transcrito: "Buenas tardes mijo, quería preguntarle, mi hija me pidió unos marcadores de esos posca para el colegio, para una maqueta, yo vivo acá en Ambato, ¿dónde los puedo comprar?"}
      espera: {tienda_id_en: [amb-centro, amb-ficoa], no_contiene: ["$", "escríbeme"]}
  juez: "Entiende el audio sin pedir que lo escriba, trata de usted, recomienda POSCA adecuadas para maqueta y tiendas de Ambato."

- id: C04
  nombre: Ubicación compartida en Cuenca (Telegram)
  canal: telegram
  turnos:
