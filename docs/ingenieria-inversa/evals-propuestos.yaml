      espera: {pide_campo: ubicacion}
    - usuario: {ubicacion: {lat: -2.9180, lng: -79.0110}}
      espera: {tienda_id_en: [cue-mall-rio]}
  juez: "Usa la ubicación compartida sin pedir la ciudad y recomienda la tienda más cercana."

- id: C05
