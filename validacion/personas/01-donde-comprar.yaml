# Personas — "¿dónde compro?" desde ciudades grandes y medianas.
# Formato: ver validacion/personas/README.md
# Las coordenadas son el centro aproximado de la ciudad/sector (para calcular la tienda más cercana
# de forma independiente al bot, a partir de bots/mokalu/tiendas.csv).

- id: p01-riobamba-mama
  nombre: "Rosa, mamá de Riobamba"
  tipo: mama
  ubicacion: {ciudad: Riobamba, provincia: Chimborazo, lat: -1.6636, lng: -78.6546}
  estilo: "todo en minúsculas, sin tildes, sin signos de apertura, mensajes muy cortos"
  intencion: donde_comprar
  contexto: "Su hija de 12 años pinta piedras y le pidió marcadores POSCA. No sabe cuál comprar."
  guion:
    - "hola buenas tardes"
    - "donde consigo los marcadores posca"
    - "soy de riobamba"
  espera:
    destino: tienda_mas_cercana
    max_mensajes_bot: 4

